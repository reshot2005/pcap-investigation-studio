[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pcap-investigation-studio"
version = "0.1.0"
description = "Filterable PCAP packet browser with beaconing and DNS tunnel heuristics"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Security Research Collection" }]
keywords = ["security", "pcap", "investigation", "browser", "beaconing"]
dependencies = [
    "secintel-core>=0.1.0",
    "typer>=0.12",
    "rich>=13.0",
    "dpkt>=1.9.8",
]

[project.optional-dependencies]
dev = [
    "secintel-core[dev]>=0.1.0",
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "jsonschema>=4.21",
]

[project.scripts]
pcap-investigation-studio = "pcap_investigation_studio.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pcap_investigation_studio"]

[tool.hatch.build.targets.sdist]
only-include = ["src/pcap_investigation_studio", "sample_data", "scripts", "docs", "report", "README.md", "LICENSE"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "S", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/pcap_investigation_studio/cli.py" = ["B008", "E501"]
"src/pcap_investigation_studio/core.py" = ["E501"]
"src/pcap_investigation_studio/parser.py" = ["S314"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["pcap_investigation_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["pcap_investigation_studio"]
